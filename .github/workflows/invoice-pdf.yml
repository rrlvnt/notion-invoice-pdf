name: Generate Invoice PDF

on:
  repository_dispatch:
    types: [notion_invoice_published]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @notionhq/client puppeteer

      - name: Render PDF
        id: render
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ github.event.client_payload.page_id }}
        run: node render.js

      - name: Upload PDF as release asset
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PDF_FILENAME: ${{ steps.render.outputs.pdf_filename }}
        run: |
          TAG="invoice-${{ github.event.client_payload.page_id }}-${{ github.run_id }}"
          gh release create "$TAG" "$PDF_FILENAME" --title "$TAG" --notes "Auto-generated invoice PDF"
          URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          echo "pdf_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write PDF link back to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE_ID: ${{ github.event.client_payload.page_id }}
          PDF_URL: ${{ steps.upload.outputs.pdf_url }}
          PDF_FILENAME: ${{ steps.render.outputs.pdf_filename }}
        run: node attach.js
